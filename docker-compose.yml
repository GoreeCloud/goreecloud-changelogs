services:
  changelogs:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    environment:
      CHANGELOGS_WRITE_TOKEN: ${CHANGELOGS_WRITE_TOKEN:-}
    volumes:
      - ./data:/app/data
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  proxy:
    external: true
