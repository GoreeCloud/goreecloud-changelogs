<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6d7cff">
  <meta name="description" content="Historical change ledger for GoreeCloud">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/glaze.css">
  <title>{% block title %}GoreeCloud Changelogs{% endblock %}</title>
</head>
<body>
  <div class="ambient a"></div><div class="ambient b"></div>
  <header class="top">
    <a class="brand" href="/"><img src="/static/icon.svg" alt=""><span><b>GoreeCloud</b><small>Changelogs</small></span></a>
    <div class="trust"><span class="shield">◆</span> Wardveil Security</div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>GoreeCloud Changelogs · historical record · privacy-first</footer>
</body>
</html>
