name: Changelogs CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python scripts/verify_ledger.py
      - name: Prove disposable ledger backup and restore
        run: |
          mkdir -p .ci-recovery
          python scripts/backup_ledger.py .ci-recovery/changelogs-backup.sqlite3 --manifest .ci-recovery/backup.json
          python scripts/validate_restore.py .ci-recovery/changelogs-backup.sqlite3 --restore-root .ci-recovery/restore --report .ci-recovery/restore.json
      - run: python -m compileall -q app scripts
